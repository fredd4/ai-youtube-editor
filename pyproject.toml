[project]
name = "ytedit"
version = "0.1.0"
description = "Semi-automated AI video editor: raw phone footage -> finished YouTube master"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "typer",
    "rich",
    "numpy",
    "pillow",
    "fastapi",
    "uvicorn",
    "elevenlabs>=2.66",
    "fal-client>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ytedit = "ytedit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
